; ===========================================================================
; PlatformIO project file for the Arduino Due flight firmware.
;
; ============================== NOT VERIFIED ===============================
; This file was written on a machine WITHOUT PlatformIO and WITHOUT any
; Arduino/SAM toolchain (`pio` and `platformio` are not installed). It has
; therefore never been built here, let alone flashed. Treat it as a reviewed
; starting point, not as a tested build.
;
; Note on wording: the Arduino Due is not an AVR board -- it is an ARM
; Cortex-M3 (Atmel SAM3X8E) -- so the relevant PlatformIO platform is
; `atmelsam`, not the AVR one. The original project was developed with the
; Arduino IDE (see firmware/readme.txt), so this file reconstructs that setup.
; ===========================================================================
;
; Each environment compiles exactly one sketch directory. PlatformIO requires
; the main sketch to be named after the directory that contains it, which is
; the case here:
;   firmware/Quadrotor_Mode_I_Arduino_Due/Quadrotor_Mode_I_Arduino_Due.ino
;   firmware/Quadrotor_Mode_II_Arduino_Due/Quadrotor_Mode_II_Arduino_Due.ino
;
; Usage (run from the repository root):
;   pio run -e due_mode_ii              # build Mode II
;   pio run -e due_mode_ii -t upload    # flash Mode II to a connected Due
;   pio run -e due_mode_i               # build Mode I
;   pio device monitor -b 115200        # serial log (Config.h: BaudRate 115200)
;
; Behaviour is selected inside the sketches by Config.h (`STR_v1`, `PID_v1`,
; `QuadP`, ...), not by build flags, so this file defines no macros.
;
; Known risks -- all unverified, check these first when the build fails:
;   1. The vendored SdFat (2015.4.26, see its library.properties) predates the
;      current Arduino SAM core and may not compile against it. If it breaks,
;      prefer the registry version (`lib_deps = SdFat` in the failing env) over
;      editing the vendored copy.
;   2. Library discovery for `IMU.h` / `STR.h` relies on
;      firmware/libraries/MyLibraries_Wenchao. `lib_ldf_mode = deep+` below is
;      the fallback if the default (chain+) misses an include; if PlatformIO
;      still cannot see them, add `lib_deps = ...` or set
;      `lib_extra_dirs = firmware/libraries` per env.
;   3. The sketches depend on analogWrite resolution, hardware timers, Servo and
;      an SD card on the Due. None of that is covered by any host test here.
;   4. Nothing here runs in CI. A red `pio run` means "toolchain/environment",
;      not necessarily "the code is wrong".
; ===========================================================================

[platformio]
default_envs = due_mode_ii

[env]
platform = atmelsam
board = due
framework = arduino
monitor_speed = 115200

; Vendored Arduino libraries of the original project: IMU/sensor drivers, the
; legacy STR class, and the bundled SdFat.
lib_extra_dirs = firmware/libraries
lib_ldf_mode = deep+

; Advisory only -- this is legacy code, warnings are expected and are not errors.
build_flags = -Wall

[env:due_mode_ii]
; Mode II: PI outer loop on attitude + STR inner loop on angular rate,
; 2nd-order ARX channel model. Config.h: LOOP_period 10 ms, STR_period 40 ms.
src_dir = firmware/Quadrotor_Mode_II_Arduino_Due

[env:due_mode_i]
; Mode I: single-loop STR on angle, 3rd-order ARX channel model.
; Config.h: STR_period 100 ms.
src_dir = firmware/Quadrotor_Mode_I_Arduino_Due
